[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ctx-guard"
version = "0.1.0"
description = "Verifiable context compression for agent sessions. Compression is a process; verifiability is the result."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "maintainers" }]
keywords = ["context", "compression", "agent", "memory", "verifiable", "ledger", "tamper-evident"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.scripts]
agent-ctx-guard = "agent_ctx_guard.__main__:main"

[tool.setuptools]
packages = ["agent_ctx_guard"]